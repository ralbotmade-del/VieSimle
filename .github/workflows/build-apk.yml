name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Test Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK & build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager "platforms;android-36.1" || sdkmanager "platforms;android-36-ext1" || echo "Optional extension platform skipped"

      - name: Prepare CI keystore and environment file
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.example.ExampleUnitTest

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Summarize APK metadata
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            SIZE=$(du -h "$APK_FILE" | cut -f1)
            SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
            {
              echo "### VieSimple Debug APK"
              echo "- **File**: \`$(basename "$APK_FILE")\`"
              echo "- **Size**: $SIZE"
              echo "- **SHA-256**: \`$SHA256\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VieSimple-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
